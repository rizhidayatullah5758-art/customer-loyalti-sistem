name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install member dependencies
        run: npm install

      - name: Member TypeScript
        run: npm run typecheck

      - name: Member Expo Doctor
        run: npx expo-doctor

      - name: Install admin dependencies
        working-directory: admin-app
        run: npm install

      - name: Admin TypeScript
        working-directory: admin-app
        run: npm run typecheck

      - name: Admin Expo Doctor
        working-directory: admin-app
        run: npx expo-doctor
